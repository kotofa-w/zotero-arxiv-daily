name: Test
on:
  workflow_dispatch:
    inputs:
      preview_classics:
        description: Send a classics preview without advancing its history
        type: boolean
        default: false
      preview_daily_reading:
        description: Generate one daily translation and guide artifact without sending email
        type: boolean
        default: false

jobs:
  calculate-and-send:
    if: ${{ !inputs.preview_daily_reading && (inputs.preview_classics || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      #  with:
      #    repository: ${{ vars.REPOSITORY }}
      #    ref: ${{ vars.REF }}

      - name: Checkout classics state for preview
        if: ${{ inputs.preview_classics }}
        uses: actions/checkout@v6
        with:
          ref: classics-state
          path: classics-state

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.1.4


      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
          CLASSICS_ENABLED: ${{ inputs.preview_classics && 'true' || 'false' }}
        run: |
          export DEBUG=true
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py

  daily-reading-preview:
    if: ${{ inputs.preview_daily_reading && !inputs.preview_classics }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup uv
        uses: astral-sh/setup-uv@v7.1.4
      - name: Generate daily reading without email
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          uv run python -m zotero_arxiv_daily.preview_daily_reading
      - name: Save HTML preview
        uses: actions/upload-artifact@v4
        with:
          name: daily-reading-preview
          path: daily-reading-preview.html
